  privacy:
    title: "Política de Privacidad"
    last_updated: "Última actualización: %{date}"
    sections:
      intro:
        title: "Introducción"
        content: "En FutPred nos tomamos muy en serio la privacidad de nuestros usuarios. Esta política describe qué información recopilamos, cómo la usamos y qué derechos tienes sobre tus datos."
      data_collected:
        title: "Datos que recopilamos"
        intro: "Recopilamos la siguiente información cuando usas FutPred:"
        items:
          - "Email: para crear tu cuenta y enviarte notificaciones"
          - "Nombre (opcional): para mostrarlo en la clasificación"
          - "Avatar (opcional): imagen de perfil que elijas subir"
          - "Predicciones: los resultados que predices para cada partido"
          - "Grupos: las organizaciones a las que perteneces"
      data_use:
        title: "Cómo usamos tus datos"
        intro: "Usamos tu información para:"
        items:
          - "Gestionar tu cuenta y autenticación"
          - "Mostrar clasificaciones y estadísticas"
          - "Enviar recordatorios de torneos (puedes desactivarlos)"
          - "Responder a tus consultas de soporte"
          - "Mejorar el servicio basándonos en el uso"
      data_sharing:
        title: "Con quién compartimos tus datos"
        intro: "No vendemos tus datos. Solo compartimos información con:"
        items:
          - "Resend: para enviar emails transaccionales y notificaciones"
          - "Hetzner: donde alojamos nuestros servidores (Alemania, cumple GDPR)"
          - "Autoridades: solo si es requerido legalmente"
      rights:
        title: "Tus derechos"
        intro: "Tienes derecho a:"
        items:
          - "Acceder a tus datos personales"
          - "Rectificar información incorrecta"
          - "Eliminar tu cuenta y todos tus datos"
          - "Exportar tus datos en formato legible"
          - "Retirar tu consentimiento en cualquier momento"
        contact_html: "Para ejercer estos derechos, contacta a <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"
      cookies:
        title: "Cookies"
        content: "Usamos únicamente cookies de sesión técnicas, necesarias para mantener tu sesión activa. No usamos cookies de seguimiento ni de publicidad."
      security:
        title: "Seguridad"
        content: "Protegemos tus datos con cifrado en tránsito (HTTPS) y en reposo. Las contraseñas se almacenan hasheadas con bcrypt. Realizamos copias de seguridad regulares."
      changes:
        title: "Cambios en esta política"
        content: "Podemos actualizar esta política ocasionalmente. Te notificaremos de cambios significativos por email. El uso continuado del servicio implica aceptación de los cambios."
      contact:
        title: "Contacto"
        content_html: "Para cualquier pregunta sobre privacidad, contacta a <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"

  terms:
    title: "Términos de Servicio"
    last_updated: "Última actualización: %{date}"
    sections:
      acceptance:
        title: "Aceptación de los términos"
        content: "Al crear una cuenta o usar FutPred, aceptas estos términos de servicio. Si no estás de acuerdo, no uses el servicio."
      service:
        title: "Descripción del servicio"
        content: "FutPred es una plataforma de predicciones de fútbol que permite a usuarios crear grupos, predecir resultados de partidos y competir en clasificaciones. El servicio se ofrece 'tal cual' sin garantías."
      accounts:
        title: "Cuentas de usuario"
        intro: "Al crear una cuenta, te comprometes a:"
        items:
          - "Proporcionar información veraz"
          - "Mantener la seguridad de tu contraseña"
          - "No compartir tu cuenta con terceros"
          - "Notificarnos de cualquier uso no autorizado"
      conduct:
        title: "Conducta del usuario"
        intro: "No está permitido:"
        items:
          - "Usar el servicio para actividades ilegales"
          - "Intentar acceder a cuentas de otros usuarios"
          - "Enviar spam o contenido ofensivo"
          - "Manipular clasificaciones o resultados"
          - "Usar bots o scripts automatizados"
      intellectual_property:
        title: "Propiedad intelectual"
        content: "FutPred y su contenido (logos, diseño, código) son propiedad de sus creadores. Los datos de partidos provienen de Football-Data.org. Los logos de torneos pertenecen a sus respectivas organizaciones."
      disclaimer:
        title: "Exención de responsabilidad"
        content: "FutPred es un servicio de entretenimiento. No promovemos ni facilitamos apuestas con dinero real. No nos hacemos responsables de decisiones tomadas basándose en predicciones del servicio."
      liability:
        title: "Limitación de responsabilidad"
        content: "En la máxima medida permitida por la ley, FutPred no será responsable de daños indirectos, incidentales o consecuentes derivados del uso del servicio."
      termination:
        title: "Terminación"
        content: "Podemos suspender o terminar tu cuenta si violas estos términos. Puedes eliminar tu cuenta en cualquier momento desde tu perfil."
      changes:
        title: "Cambios en los términos"
        content: "Podemos modificar estos términos. Los cambios significativos se notificarán por email con 30 días de antelación. El uso continuado implica aceptación."
      contact:
        title: "Contacto"
        content_html: "Para preguntas sobre estos términos, contacta a <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"
