  privacy:
    title: "Privacy Policy"
    last_updated: "Last updated: %{date}"
    sections:
      intro:
        title: "Introduction"
        content: "At FutPred, we take user privacy very seriously. This policy describes what information we collect, how we use it, and what rights you have over your data."
      data_collected:
        title: "Data we collect"
        intro: "We collect the following information when you use FutPred:"
        items:
          - "Email: to create your account and send notifications"
          - "Name (optional): to display on leaderboards"
          - "Avatar (optional): profile picture you choose to upload"
          - "Predictions: the results you predict for each match"
          - "Groups: the organizations you belong to"
      data_use:
        title: "How we use your data"
        intro: "We use your information to:"
        items:
          - "Manage your account and authentication"
          - "Display leaderboards and statistics"
          - "Send tournament reminders (you can disable these)"
          - "Respond to your support inquiries"
          - "Improve the service based on usage"
      data_sharing:
        title: "Who we share your data with"
        intro: "We do not sell your data. We only share information with:"
        items:
          - "Resend: to send transactional emails and notifications"
          - "Hetzner: where we host our servers (Germany, GDPR compliant)"
          - "Authorities: only if legally required"
      rights:
        title: "Your rights"
        intro: "You have the right to:"
        items:
          - "Access your personal data"
          - "Rectify incorrect information"
          - "Delete your account and all your data"
          - "Export your data in a readable format"
          - "Withdraw your consent at any time"
        contact_html: "To exercise these rights, contact <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"
      cookies:
        title: "Cookies"
        content: "We only use technical session cookies, necessary to keep your session active. We do not use tracking or advertising cookies."
      security:
        title: "Security"
        content: "We protect your data with encryption in transit (HTTPS) and at rest. Passwords are stored hashed with bcrypt. We perform regular backups."
      changes:
        title: "Changes to this policy"
        content: "We may update this policy occasionally. We will notify you of significant changes by email. Continued use of the service implies acceptance of changes."
      contact:
        title: "Contact"
        content_html: "For any privacy questions, contact <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"

  terms:
    title: "Terms of Service"
    last_updated: "Last updated: %{date}"
    sections:
      acceptance:
        title: "Acceptance of terms"
        content: "By creating an account or using FutPred, you accept these terms of service. If you do not agree, do not use the service."
      service:
        title: "Service description"
        content: "FutPred is a football prediction platform that allows users to create groups, predict match results, and compete on leaderboards. The service is provided 'as is' without warranties."
      accounts:
        title: "User accounts"
        intro: "When creating an account, you agree to:"
        items:
          - "Provide accurate information"
          - "Keep your password secure"
          - "Not share your account with others"
          - "Notify us of any unauthorized use"
      conduct:
        title: "User conduct"
        intro: "You may not:"
        items:
          - "Use the service for illegal activities"
          - "Attempt to access other users' accounts"
          - "Send spam or offensive content"
          - "Manipulate leaderboards or results"
          - "Use bots or automated scripts"
      intellectual_property:
        title: "Intellectual property"
        content: "FutPred and its content (logos, design, code) are owned by its creators. Match data comes from Football-Data.org. Tournament logos belong to their respective organizations."
      disclaimer:
        title: "Disclaimer"
        content: "FutPred is an entertainment service. We do not promote or facilitate real-money gambling. We are not responsible for decisions made based on predictions from the service."
      liability:
        title: "Limitation of liability"
        content: "To the maximum extent permitted by law, FutPred will not be liable for indirect, incidental, or consequential damages arising from use of the service."
      termination:
        title: "Termination"
        content: "We may suspend or terminate your account if you violate these terms. You can delete your account at any time from your profile."
      changes:
        title: "Changes to terms"
        content: "We may modify these terms. Significant changes will be notified by email with 30 days notice. Continued use implies acceptance."
      contact:
        title: "Contact"
        content_html: "For questions about these terms, contact <a href='mailto:%{email}' class='text-emerald-400 hover:underline'>%{email}</a>"
