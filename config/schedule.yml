tournament_reminders:
  cron: "0 8 * * *"
  class: "SendTournamentRemindersJob"
  description: "Send tournament reminder emails and create banner notifications"

sync_results:
  cron: "*/5 * * * *"
  class: "SyncResultsJob"
  description: "Sync fixture results from Football-Data API (only runs when matches are live or upcoming)"
