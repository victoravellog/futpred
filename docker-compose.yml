services:
  postgres:
    image: postgres:17
    container_name: futpred_postgres
    environment:
      POSTGRES_USER: futpred
      POSTGRES_PASSWORD: futpred
      POSTGRES_DB: futpred_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: futpred_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
