services:
  web:
    image: ghcr.io/victoravellog/futpred:latest
    ports:
      - "3000:80"
    environment:
      - DATABASE_URL=postgres://futpred:futpred@postgres:5432/futpred
      - REDIS_URL=redis://redis:6379/0
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -hex 64)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  sidekiq:
    image: ghcr.io/victoravellog/futpred:latest
    command: bundle exec sidekiq
    environment:
      - DATABASE_URL=postgres://futpred:futpred@postgres:5432/futpred
      - REDIS_URL=redis://redis:6379/0
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: futpred
      POSTGRES_PASSWORD: futpred
      POSTGRES_DB: futpred
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futpred"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
