<svg width="400" height="400" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <title>FutPred Logo</title>
  <desc>Escudo FutPred blanco, negro y rojo con 2 estrellas y tagline</desc>

  <!-- Shield outer border -->
  <path d="M340,48 L472,93 L472,272 Q472,388 340,438 Q208,388 208,272 L208,93 Z" fill="#111111"/>

  <!-- Shield fill blanco -->
  <path d="M340,58 L462,100 L462,271 Q462,379 340,427 Q218,379 218,271 L218,100 Z" fill="#F5F5F5"/>

  <!-- Rayas verticales mitad izquierda -->
  <clipPath id="left-half">
    <path d="M340,58 L340,427 Q218,379 218,271 L218,100 Z"/>
  </clipPath>
  <g clip-path="url(#left-half)">
    <rect x="218" y="58" width="10" height="370" fill="#DDDDDD"/>
    <rect x="238" y="58" width="10" height="370" fill="#DDDDDD"/>
    <rect x="258" y="58" width="10" height="370" fill="#DDDDDD"/>
    <rect x="278" y="58" width="10" height="370" fill="#DDDDDD"/>
    <rect x="298" y="58" width="10" height="370" fill="#DDDDDD"/>
    <rect x="318" y="58" width="10" height="370" fill="#DDDDDD"/>
  </g>

  <!-- Center vertical divider -->
  <line x1="340" y1="58" x2="340" y2="427" stroke="#111111" stroke-width="2.5"/>

  <!-- Horizontal red band FUT -->
  <path d="M220,191 L460,191 L460,244 L220,244 Z" fill="#C8102E"/>
  <text x="340" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#F5F5F5" letter-spacing="10">FUT</text>

  <!-- 2 Stars -->
  <polygon points="316,155 320,167 333,167 323,175 327,187 316,179 305,187 309,175 299,167 312,167" fill="#C8102E"/>
  <polygon points="364,155 368,167 381,167 371,175 375,187 364,179 353,187 357,175 347,167 360,167" fill="#C8102E"/>

  <!-- Soccer ball -->
  <circle cx="340" cy="305" r="33" fill="#F5F5F5"/>
  <polygon points="340,289 351,296 347,309 333,309 329,296" fill="#111111"/>
  <line x1="340" y1="289" x2="340" y2="272" stroke="#111111" stroke-width="1.3"/>
  <line x1="351" y1="296" x2="366" y2="290" stroke="#111111" stroke-width="1.3"/>
  <line x1="347" y1="309" x2="355" y2="323" stroke="#111111" stroke-width="1.3"/>
  <line x1="333" y1="309" x2="325" y2="323" stroke="#111111" stroke-width="1.3"/>
  <line x1="329" y1="296" x2="314" y2="290" stroke="#111111" stroke-width="1.3"/>
  <circle cx="340" cy="305" r="33" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- PRED text -->
  <text x="340" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#111111" letter-spacing="8">PRED</text>

  <!-- Shield outlines -->
  <path d="M340,48 L472,93 L472,272 Q472,388 340,438 Q208,388 208,272 L208,93 Z" fill="none" stroke="#111111" stroke-width="3.5"/>
  <path d="M340,58 L462,100 L462,271 Q462,379 340,427 Q218,379 218,271 L218,100 Z" fill="none" stroke="#C8102E" stroke-width="1.2"/>

  <!-- Tagline roja base -->
  <path d="M222,393 L458,393 L450,427 Q395,428 340,428 Q285,428 230,427 Z" fill="#C8102E"/>
  <text x="340" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F5F5" letter-spacing="3">PREDICE · COMPITE · GANA</text>

</svg>
