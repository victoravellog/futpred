<svg height="50" viewBox="10 6 290 108" xmlns="http://www.w3.org/2000/svg">
  <title>FutPred Logo Dark</title>
  <desc>Logo horizontal FutPred para fondos oscuros</desc>

  <!-- Shield outer -->
  <path d="M60,8 L108,22 L108,68 Q108,96 60,110 Q12,96 12,68 L12,22 Z" fill="#111111"/>
  <!-- Shield fill -->
  <path d="M60,14 L102,27 L102,67 Q102,92 60,105 Q18,92 18,67 L18,27 Z" fill="#F5F5F5"/>

  <!-- Rayas izquierda -->
  <clipPath id="sh-left">
    <path d="M60,14 L60,105 Q18,92 18,67 L18,27 Z"/>
  </clipPath>
  <g clip-path="url(#sh-left)">
    <rect x="18" y="14" width="4" height="92" fill="#DDDDDD"/>
    <rect x="27" y="14" width="4" height="92" fill="#DDDDDD"/>
    <rect x="36" y="14" width="4" height="92" fill="#DDDDDD"/>
    <rect x="45" y="14" width="4" height="92" fill="#DDDDDD"/>
    <rect x="54" y="14" width="4" height="92" fill="#DDDDDD"/>
  </g>

  <!-- Center divider -->
  <line x1="60" y1="14" x2="60" y2="105" stroke="#111111" stroke-width="1.2"/>

  <!-- Red band -->
  <path d="M19,46 L101,46 L101,66 L19,66 Z" fill="#C8102E"/>
  <text x="60" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F5F5" letter-spacing="3">FUT</text>

  <!-- 2 stars -->
  <polygon points="48,33 50,39 56,39 51,43 53,49 48,45 43,49 45,43 40,39 46,39" fill="#C8102E"/>
  <polygon points="72,33 74,39 80,39 75,43 77,49 72,45 67,49 69,43 64,39 70,39" fill="#C8102E"/>

  <!-- Ball -->
  <circle cx="60" cy="84" r="11" fill="#F5F5F5"/>
  <polygon points="60,79 63,81 62,85 58,85 57,81" fill="#111111"/>
  <line x1="60" y1="79" x2="60" y2="73" stroke="#111111" stroke-width="0.8"/>
  <line x1="63" y1="81" x2="68" y2="79" stroke="#111111" stroke-width="0.8"/>
  <line x1="62" y1="85" x2="65" y2="90" stroke="#111111" stroke-width="0.8"/>
  <line x1="58" y1="85" x2="55" y2="90" stroke="#111111" stroke-width="0.8"/>
  <line x1="57" y1="81" x2="52" y2="79" stroke="#111111" stroke-width="0.8"/>
  <circle cx="60" cy="84" r="11" fill="none" stroke="#111111" stroke-width="0.8"/>

  <!-- Shield outlines -->
  <path d="M60,8 L108,22 L108,68 Q108,96 60,110 Q12,96 12,68 L12,22 Z" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M60,14 L102,27 L102,67 Q102,92 60,105 Q18,92 18,67 L18,27 Z" fill="none" stroke="#C8102E" stroke-width="0.8"/>

  <!-- App name (white for dark backgrounds) -->
  <text x="128" y="58" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Fut</text>
  <text x="197" y="58" font-family="system-ui, sans-serif" font-size="36" font-weight="300" fill="#C8102E">Pred</text>

  <!-- Tagline -->
  <text x="129" y="76" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="2">PREDICE · COMPITE · GANA</text>

</svg>
