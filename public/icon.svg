<svg width="512" height="512" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield outer -->
  <path d="M60,4 L112,20 L112,72 Q112,104 60,116 Q8,104 8,72 L8,20 Z" fill="#111111"/>
  <!-- Shield fill -->
  <path d="M60,10 L106,25 L106,71 Q106,100 60,111 Q14,100 14,71 L14,25 Z" fill="#F5F5F5"/>

  <!-- Rayas izquierda -->
  <clipPath id="sh-left">
    <path d="M60,10 L60,111 Q14,100 14,71 L14,25 Z"/>
  </clipPath>
  <g clip-path="url(#sh-left)">
    <rect x="14" y="10" width="6" height="102" fill="#DDDDDD"/>
    <rect x="26" y="10" width="6" height="102" fill="#DDDDDD"/>
    <rect x="38" y="10" width="6" height="102" fill="#DDDDDD"/>
    <rect x="50" y="10" width="6" height="102" fill="#DDDDDD"/>
  </g>

  <!-- Center divider -->
  <line x1="60" y1="10" x2="60" y2="111" stroke="#111111" stroke-width="1.5"/>

  <!-- Red band -->
  <path d="M15,48 L105,48 L105,72 L15,72 Z" fill="#C8102E"/>
  <text x="60" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F5F5F5" letter-spacing="4">FUT</text>

  <!-- Ball -->
  <circle cx="60" cy="92" r="12" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
  <polygon points="60,87 64,90 62,94 58,94 56,90" fill="#111111"/>

  <!-- Shield outline -->
  <path d="M60,4 L112,20 L112,72 Q112,104 60,116 Q8,104 8,72 L8,20 Z" fill="none" stroke="#111111" stroke-width="3"/>
</svg>
