argentina_brasil:
  round: copa_grupos
  home_team: argentina
  away_team: brasil
  kickoff_at: <%= 1.week.from_now %>
  status: 0
  external_id: fix-001

chile_colombia:
  round: copa_grupos
  home_team: chile
  away_team: colombia
  kickoff_at: <%= 1.week.from_now + 3.hours %>
  status: 0
  external_id: fix-002

argentina_chile_finished:
  round: copa_grupos
  home_team: argentina
  away_team: chile
  kickoff_at: <%= 1.day.ago %>
  home_score: 2
  away_score: 1
  status: 2
  external_id: fix-003

# Partido de cuartos con penales (1-1 en 120min, 4-3 en penales)
brasil_colombia_penalties:
  round: copa_cuartos
  home_team: brasil
  away_team: colombia
  kickoff_at: <%= 2.days.ago %>
  home_score: 1
  away_score: 1
  home_penalty_score: 4
  away_penalty_score: 3
  status: 2
  external_id: fix-004

# Partido de final sin penales
argentina_brasil_final:
  round: copa_final
  home_team: argentina
  away_team: brasil
  kickoff_at: <%= 3.days.ago %>
  home_score: 3
  away_score: 1
  status: 2
  external_id: fix-005
